<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EVIDA 테스트 웹</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #f5f7fb; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 24px; }
    .card { background: white; border: 1px solid #dde3ef; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    input, textarea, select, button { width: 100%; padding: 10px; border: 1px solid #cfd8e7; border-radius: 8px; box-sizing: border-box; }
    button { background: #2563eb; color: #fff; border: 0; cursor: pointer; margin-top: 8px; }
    pre { background: #0f172a; color: #e2e8f0; padding: 10px; border-radius: 8px; min-height: 100px; overflow: auto; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>EVIDA 테스트 웹</h1>
    <div class="card">
      <h3>기본 인증</h3>
      <div class="row">
        <input id="username" value="employee" placeholder="username" />
        <input id="password" type="password" value="employee1234" placeholder="password" />
      </div>
    </div>

    <div class="card">
      <h3>영수증 업로드</h3>
      <div class="row">
        <input id="employeeId" value="EMP-001" placeholder="employeeId" />
        <input id="employeeName" value="홍길동" placeholder="employeeName" />
      </div>
      <div class="row">
        <input id="department" value="영업팀" placeholder="department" />
        <select id="receiptTypeHint"><option>CARD</option><option>MANUAL</option></select>
      </div>
      <div class="row">
        <input id="merchantHint" value="일반가맹점" placeholder="merchantHint" />
        <input id="categoryHint" value="일반비용" placeholder="categoryHint" />
      </div>
      <div class="row">
        <input id="amountHint" value="18000" type="number" placeholder="amountHint" />
        <input id="expenseDateHint" type="date" />
      </div>
      <input id="paymentTimeHint" type="datetime-local" />
      <input id="file" type="file" />
      <button id="uploadBtn">업로드</button>
      <pre id="uploadOut"></pre>
    </div>

    <div class="card">
      <h3>조회/제출</h3>
      <div class="row">
        <input id="expenseId" placeholder="expenseId" />
        <select id="statusFilter"><option value="">전체</option><option>READY_TO_SUBMIT</option><option>NEEDS_CLARIFICATION</option><option>MANUAL_CHECK</option><option>REJECTED</option><option>SUBMITTED</option></select>
      </div>
      <textarea id="clarificationAnswer">거래처 미팅 비용입니다.</textarea>
      <button id="listBtn">목록 조회</button>
      <button id="detailBtn">상세 조회</button>
      <button id="submitBtn">제출</button>
      <pre id="expenseOut"></pre>
    </div>
  </div>

  <script>
    const auth = () => 'Basic ' + btoa(document.getElementById('username').value + ':' + document.getElementById('password').value);
    const out = (id, v) => document.getElementById(id).textContent = typeof v === 'string' ? v : JSON.stringify(v, null, 2);
    const req = async (url, options = {}) => {
      const res = await fetch(url, { ...options, headers: { Authorization: auth(), ...(options.headers || {}) } });
      const text = await res.text();
      let body = text;
      try { body = text ? JSON.parse(text) : {}; } catch (_) {}
      if (!res.ok) throw new Error(JSON.stringify(body, null, 2));
      return body;
    };

    const now = new Date();
    document.getElementById('expenseDateHint').value = now.toISOString().slice(0, 10);
    document.getElementById('paymentTimeHint').value = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);

    document.getElementById('uploadBtn').onclick = async () => {
      try {
        let file = document.getElementById('file').files[0];
        if (!file) file = new File(['sample receipt'], 'sample.txt', { type: 'text/plain' });
        const fd = new FormData();
        ['employeeId','employeeName','department','merchantHint','categoryHint','amountHint','expenseDateHint','receiptTypeHint'].forEach(k => fd.append(k, document.getElementById(k).value));
        fd.append('paymentTimeHint', document.getElementById('paymentTimeHint').value + ':00');
        fd.append('file', file);
        const data = await req('/api/expenses', { method: 'POST', body: fd });
        document.getElementById('expenseId').value = data.id;
        out('uploadOut', data);
      } catch (e) { out('uploadOut', e.message); }
    };

    document.getElementById('listBtn').onclick = async () => {
      try {
        const status = document.getElementById('statusFilter').value;
        out('expenseOut', await req('/api/expenses' + (status ? ('?status=' + encodeURIComponent(status)) : '')));
      } catch (e) { out('expenseOut', e.message); }
    };

    document.getElementById('detailBtn').onclick = async () => {
      try { out('expenseOut', await req('/api/expenses/' + document.getElementById('expenseId').value)); }
      catch (e) { out('expenseOut', e.message); }
    };

    document.getElementById('submitBtn').onclick = async () => {
      try {
        out('expenseOut', await req('/api/expenses/' + document.getElementById('expenseId').value + '/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ clarificationAnswer: document.getElementById('clarificationAnswer').value })
        }));
      } catch (e) { out('expenseOut', e.message); }
    };
  </script>
</body>
</html>
